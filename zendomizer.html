  background-repeat: no-repeat;

@media (max-width: 1068px) {
  .layout {
    flex-direction: column;
    align-items: center; /* vorher: stretch - zentriert jetzt auch .category-grid & .center-panel sauber, */
                          /* .filter-wrapper/.results-panel/#grandraceTicker haben ohnehin eigenes width:100% */
  }

  /* Zielvision Mobile: Filter -> Ergebnisse -> Route/Modifier -> Kategorien.
     .left-panel/.right-panel sind nur noch Markup-Wrapper (kein eigenes Box-Layout mehr),
     ihre Kinder werden per "order" direkt in .layout einsortiert. */
  .left-panel,
  .right-panel {
    display: contents;
  }

  .left-panel,
  .center-panel,
  .right-panel {
    max-width: 100%;
    flex: none;
  }

  .filter-wrapper  { order: 1; }
  .center-panel     { order: 2; } /* GO-Button */
  .results-panel    { order: 3; }
  #grandraceTicker   { order: 4; }
  .category-grid      { order: 5; }

  .button-top {
    justify-content: center;
  }
}
@media (min-width: 1069px) {
  .center-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;   /* Buttons nach unten drücken */
    min-height: 600px; ;         /* passend zur Automatenhöhe POLD:height: 600px;*/
  }

  .button-top {
    margin-top: auto;
    margin-bottom: -80px;         /* Button Abstand vom unteren Rand statt 42 - Original-Verhalten
                                      wiederhergestellt (transform-Versuch hat wegen Flex-Item-
                                      Margins, die NICHT kollabieren, zur Ueberlappung gefuehrt) */
    position: relative;            /* Bezugspunkt fuer den absolut positionierten Twitch-Block */
  }

  /* Twitch-Block bewusst aus dem Flex-Fluss genommen (position:absolute) und relativ zu
     .button-top verankert - dadurch bleibt die GO-Button-Position exakt wie vorher (einziges
     Flex-Kind mit margin-top:auto/margin-bottom:-80px), unabhaengig davon ob das Twitch-Panel
     auf- oder zugeklappt ist (unterschiedliche Hoehe wuerde bei Flex-Fluss sonst die GO-Position
     mitverschieben). */
  .twitch-settings-wrapper {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 24px;
    width: 260px;
    max-width: 260px;
  }
}

.slot-box {
  width: 100%;
  max-width: 372px; /* vorher: 372px fest - jetzt schrumpfbar; width + 2* padding (12) + 2* boarder (8) = Geasmtbreite || statt 396px*/
  height: 120px;

  align-items: center;

}
.slot-category {

  white-space: nowrap;

}
.slot-name {
  font-size: 20px;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  text-align: center;
  word-break: break-word;
}
.slot-box.empty .slot-name {
  font-size: 80px;
  animation: spin3D 1.6s linear infinite, pulse-text 1.2s infinite;
  transform-style: preserve-3d;
  /* Kein backface-visibility: hidden - sonst ist das Fragezeichen zwischen
     90 und 270 Grad unsichtbar und die Drehung wirkt, als beginne sie nach
     einer halben Umdrehung von vorn. */
}
.question-mark {
  text-shadow:
    0 0 2px currentColor,
    0 0 6px currentColor,
    0 0 12px currentColor;
}
.slot-box.empty .question-mark {
  font-size: 80px;
  animation: pulse-text 1.2s infinite;
  line-height: 1;
}
.slot-box .question-mark {
  font-size: 80px;
  animation: spin3D 1.6s linear infinite, pulse-text 1.2s infinite;
  line-height: 1;
  transform-style: preserve-3d;
}
.slot-box.empty {
  perspective: 600px;
}
@keyframes spin3D {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}
.slot-warning {

}

}

<script src="https://shogun160.github.io/TCM-ZEN_DOMIZER/cars/vehicles.json" type="application/json"></script>
<script>
  let currentLang = localStorage.getItem("zendomizerLang") || "de";
  let translations = {};
  let availableLanguages = [];
  let bikeFilterMode = "no_bike"; // → "top_tier" → "rc_cars" → "bike" → "all" → wieder "no_bike"

  function t(key, vars = {}) {
    let str = translations?.[currentLang]?.[key] || key;
    for (const [k, v] of Object.entries(vars)) {
      str = str.replaceAll(`{${k}}`, v);
    }
    return str;
  }
  // Mapping für Era-Werte
  const eraTranslationKeys = {
    "classic": "era_classic",
    "modern": "era_modern"
  };

  function translateEra(value) {
    const key = eraTranslationKeys[value?.toLowerCase()];
    return key ? t(key) : value;
  }

  function translateCountry(value) {
    const key = "country_" + (value || "").toLowerCase().replace(/\s+/g, "_");
    return t(key);
  }

  let vehicles = [];

  Promise.all([
    fetch("translations/i18n.json").then(res => res.json()),
    fetch("cars/vehicles.json").then(res => res.json())
  ])
  .then(([i18nData, vehicleData]) => {
    translations = i18nData;
    availableLanguages = Object.keys(i18nData.meta || {});
    vehicles = vehicleData;

    createLanguageSwitcher();
    applyTranslations();
    initializeDropdowns();
    updateSlotBoxes();
    updateResetButtonState();
    updateGoButtonState();
    loadTwitchSettings();
  })
  .catch(err => {
    console.error("❌ Fehler beim Laden der Daten:", err);
  });

  function createLanguageSwitcher() {
      const container = document.createElement("div");
      container.id = "langSwitcher";
      container.style.position = "absolute";
      container.style.top = "12px";
      container.style.right = "12px";
      container.style.zIndex = "500";
      container.style.display = "flex";
      container.style.gap = "12px";
    
      for (const lang of availableLanguages) {
        const meta = translations.meta[lang];
        const btn = document.createElement("button");
    
        // 🖼️ Flaggenbild einfügen
        const img = document.createElement("img");
        img.src = `translations/flags/${lang.toUpperCase()}.png`;
        img.alt = meta.label || lang;
        img.style.width = "36px";
        img.style.height = "24px";
        img.style.borderRadius = "4px";
        img.style.objectFit = "cover";
    
        btn.appendChild(img);
    
        btn.title = meta.label || lang;
        btn.classList.add("lang-button");
        if (lang === currentLang) {
          btn.classList.add("active");
        }
    
        btn.style.fontSize = "0"; // Text unterdrücken
        btn.style.cursor = "pointer";
        btn.style.background = "transparent";
        btn.style.border = "none";
    
        btn.onclick = () => {
          currentLang = lang;
          persist("zendomizerLang", lang);
          applyTranslations();
          document.querySelectorAll(".lang-button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        };
    
        container.appendChild(btn);
      }
    
      document.body.appendChild(container);
    }

  function rebuildEraDropdown() {
    const eraSelect = document.getElementById("eraSelect");
    if (!eraSelect) return;

    const selectedValue = eraSelect.value;
    const eraSet = new Set(vehicles.map(v => v.era));

    eraSelect.innerHTML = "";

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = t("filter_era");
    eraSelect.appendChild(empty);

    [...eraSet].sort().forEach(era => {
      const option = document.createElement("option");
      option.value = era;
      option.textContent = translateEra(era);
      eraSelect.appendChild(option);
    });

    eraSelect.value = selectedValue;
  }

  function rebuildCountryDropdown() {
    const countrySelect = document.getElementById("countrySelect");
    if (!countrySelect) return;

    const selectedValue = countrySelect.value;
    const countrySet = new Set(vehicles.map(v => v.country));

    countrySelect.innerHTML = "";

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = t("filter_country");
    countrySelect.appendChild(empty);

    [...countrySet].sort().forEach(country => {
      const option = document.createElement("option");
      option.value = country;
      option.textContent = t("country_" + (country || "").toLowerCase().replace(/\s+/g, "_")) || country;
      countrySelect.appendChild(option);
    });

    countrySelect.value = selectedValue;
  }


  function applyTranslations() {
    document.querySelector("#countrySelect option[value='']").textContent = t("filter_country");
    document.querySelector("#brandSelect option[value='']").textContent = t("filter_brand");
    document.querySelector("#eraSelect option[value='']").textContent = t("filter_era");

    const bfb = document.getElementById("bikeFilterBtn");
    if (bfb) {
      if (bikeFilterMode === "no_bike") {
        bfb.innerText = t("bike_no");
      } else if (bikeFilterMode === "top_tier") {
        bfb.innerText = t("top_tier");
      } else if (bikeFilterMode === "rc_cars") {
        bfb.innerText = t("rc_cars");
      } else if (bikeFilterMode === "bike") {
        bfb.innerText = t("bike_yes");
      } else {
        bfb.innerText = t("bike_all");
      }
    }
    rebuildEraDropdown();
    rebuildCountryDropdown();
    updateTwitchLabels();
  }

  function updateTwitchLabels() {
    const connectBtn = document.getElementById("twitchConnectBtn");
    const tokenInput = document.getElementById("twitchToken");
    if (connectBtn) connectBtn.textContent = t("twitch_connect");
    if (tokenInput) tokenInput.placeholder = t("twitch_token_label");
  }

    /*
     * BEGIN: Borrowed from https://github.com/calamity-inc/motorfe.st/
     */
    const ROTATION_START = 1786353600; // synced from tunerfest.app/grand-race, 2026-08-10
    const ROTATION = [
        [ 'Mauna Pele', "ST2 > AGP > Racing", "No Collision" ],
        [ 'Wailea', "Racing > RR > Hyper" ],
        [ 'Nuuanu - Punchbowl', "ST1 > Hyper > AGP", "Special Selection" ],
        [ 'Hana', "ST2 > Racing > Motocross" ],
        [ 'Kalaeloa', "Hyper > AGP > Racing", "Special Weather" ],
        [ 'Lahaina', "Monster > ST2 > Hyper" ],
        [ 'Peacock Flats', "ST1 > AGP > Racing", "No Collision" ],
        [ 'Haleakala', "AGP > Drift > Rally" ],
        [ 'The Barrens', "ST2 > Racing > Hyper", "Special Selection" ],
        [ 'Hana', "RR > Hyper > Rally" ],
        [ 'Pearl Harbor', "Racing > ST2 > Racing", "Pro Racing" ],
        [ 'Wahiawa Fields', "ST1 > ST2 > RR" ],
        [ 'Kahakuloa', "Racing > AGP > Hyper", "No Collision" ],
        [ 'Kaho\'olawe', "Hyper > Hyper > Hyper" ],
        [ 'Lahaina', "ST1 > ST2 > Racing", "Special Selection" ],
        [ 'Ma\'akua Black Beach', "AGP > RR > Hyper" ],
        [ 'Kula', "Hyper > Jet > AGP", "Air Only" ],
        [ 'Kahuku', "ST2 > Monster > Hyper" ],
        [ 'Kaneohe', "ST1 > Hyper > Racing", "No Collision" ],
        [ 'Kaena Point', "ST2 > RR > Motocross" ],
        [ 'Paia', "ST1 > Drift > Hyper", "Special Selection" ],
        [ 'Waikiki', "AGP > Racing > Rally" ],
        [ 'Diamond Head', "Hyper > ST2 > Racing", "Special Selection" ],
        [ 'Mauna Pele', "Motocross > Hyper > AGP" ],
        [ 'Haleakala', "ST1 > Racing > Hyper", "No Collision" ],
        [ 'Nuuanu - Punchbowl', "RR > RR > RR", "Special Selection" ],
        [ 'Wailea', "Hyper > ST2 > Racing", "Special Weather" ],
        [ 'Kalaeloa', "RR > Rally > ST2" ],
        [ 'Hana', "AGP > Racing > Hyper", "Pro Racing" ],
        [ 'Peacock Flats', "ST2 > RR > Racing" ],
        [ 'Kaneohe', "RR > Hyper > Drift", "No Collision" ],
        [ 'Kula', "ST2 > Racing > Hyper" ],
        [ 'Nuuanu - Punchbowl', "Racing > Jet > ST2", "Air Only" ],
        [ 'Wahiawa Fields', "ST1 > ST1 > ST1", "Special Selection" ],
        [ 'Kahakuloa', "AGP > Rally > Hyper" ],
        [ 'Ma\'akua Black Beach', "Hyper > Racing > ST2", "Special Selection" ],
        [ 'Kahakuloa', "Drift > AGP > RR" ],
        [ 'Haleiwa', "ST2 > Hyper > Racing", "Pro Racing" ],
        [ 'Kealaloloa', "ST1 > Motocross > Hyper" ],
        [ 'Kaena Point', "Racing > ST2 > AGP", "No Collision" ],
        [ 'Lahaina', "Hyper > Monster > Rally" ],
        [ 'Kaneohe', "ST1 > Hyper > ST2", "Special Selection" ],
        [ 'Kula', "ST1 > RR > Hyper" ],
        [ 'Nuuanu - Punchbowl', "Racing > Jet > ST2", "Air Only" ],
        [ 'Diamond Head', "Hyper > Rally > Drift" ]
    ];
    const EVENT_DURATION = 10 * 60;
    const ROTATION_DURATION = ROTATION.length * EVENT_DURATION;

    function getCurrentEventIndex()
    {
        return ((((new Date() / 1000) - ROTATION_START) % ROTATION_DURATION) / EVENT_DURATION) | 0;
    }
    /*
     * END: Borrowed from https://github.com/calamity-inc/motorfe.st/
     */
    // Hier standen getCurrentUTC(), GRDAY_START/GRDAY_STOP und isGrandRaceDay(). Sie bildeten
    // die alte Regel "Modifikatoren nur Samstag 9:00 bis Sonntag 9:00 UTC" ab und steuerten den
    // Ticker-Zusatz "It's modificator day". Die Regel gilt nicht mehr - die Modifikatoren kommen
    // heute ueber die Rotation selbst (siehe ROTATION, dritte Spalte) und gelten an allen Tagen.
    // Die Funktion war ohnehin defekt: getDay() liefert 0=Sonntag..6=Samstag, der Code nahm
    // 1=Montag..7=Sonntag an, wodurch GRDAY_STOP=[8,..] nie erreichbar war; zudem las sie
    // Ortszeit statt UTC.

    /* Map rotation types to checkbox Ids */
    const ROTATION_MAP = new Map([
      ["ST1", "cat1"],
      ["ST2", "cat2"],
      ["Hyper", "cat8"],
      ["Racing", "cat3"],
      ["AGP", "cat4"],
      ["Motocross", "cat5"],
      ["Rally", "cat7"],
      ["Rally/Plane", "cat7"],
      ["RR", "cat6"],
      ["Monster", "cat9"],
      ["Drift", "cat10"], // Drift integriert
    ]);

    let selectedOrder = [];
    let drawExecuted = false;
    let isDrawing = false; // verhindert überlappende handleGo()-Aufrufe (z.B. Doppelklick auf GO),
                            // die sonst zu Race-Conditions bei der Blacklist fuehren koennen -
                            // besonders sichtbar bei kleinen Fahrzeug-Pools (z.B. RC-Cars-Filter)
    let grandraceCategories = [];
    // JET_VEHICLE: festes Bonusfahrzeug fuer die Jet-Kategorie in der Grandrace-Rotation
    // (kein Eintrag in vehicles.json, kein Filter-Checkbox - siehe drawVehicleForCategory)
    const JET_VEHICLE = { category: 'Jet', brand: 'Dassault Aviation', model: 'Alpha Jet – Red Bull Edition', year: null, country: null, era: null, bike: false, top_tier: false };

    function formatVehicleName(v) {
      if (!v) return '';
      return v.year ? `${v.brand} ${v.model} (${v.year})` : `${v.brand} ${v.model}`;
    }
    // Fahrzeuge haben keine ID - Marke/Modell/Baujahr identifizieren sie eindeutig.
    function isSameVehicle(a, b) {
      return !!a && !!b && a.brand === b.brand && a.model === b.model && a.year === b.year;
    }
    // Die Hotkeys haengen global am document. Waehrend jemand in ein Textfeld tippt, duerfen
    // sie nicht feuern: im Twitch-Token-Feld haette ein grosses "R" die Blacklist geleert,
    // ein "X" das Ziehlog und ein "c" die Zwischenablage ueberschrieben.
    // Checkboxen und Dropdowns sind bewusst NICHT ausgenommen - sonst waere "Filter setzen,
    // dann Enter" kaputt, weil der Fokus noch auf dem Bedienelement liegt.
    // Der Ziehlog bekommt drei Eintraege je Ziehung (~0,6 KB) und wurde nie beschnitten.
    // Bei 100 Ziehungen am Tag ist die 5-MB-Quota des Browsers nach rund 80 Tagen erreicht -
    // danach warf setItem() mitten in der Ziehung. 500 Eintraege sind rund 165 Ziehungen
    // und damit mehr, als eine Session je braucht (Shift+L zeigt sie als Tabelle).
    const MAX_DRAW_LOG = 500;

    // Alle Schreibzugriffe laufen hierueber. localStorage kann voll sein oder komplett
    // gesperrt (privates Fenster) - beides darf eine laufende Ziehung nicht abbrechen.
    function persist(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (err) {
        // Groesster Posten ist der Ziehlog. Einmal halbieren und erneut versuchen, damit
        // vor allem die Blacklist weiter gespeichert wird - ohne sie wiederholen sich
        // Fahrzeuge nach einem Reload.
        if (window.drawLog && window.drawLog.length > 1) {
          window.drawLog = window.drawLog.slice(-Math.floor(window.drawLog.length / 2));
          try {
            localStorage.setItem("zendomizerDrawLog", JSON.stringify(window.drawLog));
            localStorage.setItem(key, value);
            return true;
          } catch (zweiterVersuch) {
            // faellt unten durch
          }
        }
        console.warn(`⚠️ localStorage: "${key}" konnte nicht gespeichert werden`, err);
        return false;
      }
    }

    // Ziehlog fortschreiben und dabei deckeln
    function appendDrawLog(entry) {
      window.drawLog.push(entry);
      if (window.drawLog.length > MAX_DRAW_LOG) {
        window.drawLog = window.drawLog.slice(-MAX_DRAW_LOG);
      }
      persist("zendomizerDrawLog", JSON.stringify(window.drawLog));
    }

    function isTypingTarget(el) {
      if (!el) return false;
      if (el.isContentEditable) return true;
      if (el.tagName === 'TEXTAREA') return true;
      if (el.tagName !== 'INPUT') return false;
      return !['checkbox', 'radio', 'button', 'submit', 'reset', 'range', 'color', 'file'].includes(el.type);
    }
    let recentDraws = {}; // 🆕 Merkt sich die letzten Fahrzeuge pro Kategorie
    let toastTimer = null;
    window.drawLog = [];
    window.drawRound = 0;
    window.devLoggingEnabled = false;

    // "Main Stage" war ein Alt-Modifikator und kommt in der aktuellen Rotation nicht mehr vor.
    // Die Sonderbehandlung dafuer (Kategorien abwaehlen, manuelle Auswahl erzwingen) ist deshalb
    // entfallen - samt previousMainStage und grandraceActive, die nur noch dafuer gelesen wurden.
    function updateGrandraceState(triggeredByClick = false) {
      const grandraceCheckbox = document.getElementById('catGR');
      const index = getCurrentEventIndex();
      const entry = ROTATION[index];

      if (!grandraceCheckbox.checked) return;

      const expectedCategories = entry[1].split(" > "); // z.B. ["Hyper","Jet","AGP"] - Jet bleibt als Literal erhalten
      // 🛠️ Bugfix: einige Rotationen haben doppelte/identische Kategorien in allen 3 Slots
      // (z.B. "ST1 > ST1 > ST1") - die bilden alle auf DIESELBE Checkbox ab. Ohne Dedup hatte
      // expectedIds hier immer 3 Eintraege, waehrend selectedIds (echte angehakte Checkboxen)
      // nur 1 hat - die Laengen stimmten nie ueberein, wodurch der alle-1000ms laufende
      // Grandrace-Check (siehe setInterval unten) den "Mismatch"-Zweig IMMER ausgeloest und
      // via updateSlotBoxes() die gerade gezogenen Ergebnisboxen fortlaufend wieder geleert hat -
      // sichtbar als "Fahrzeuge kurz angezeigt, dann leer" (lastSelection blieb dabei korrekt,
      // daher stimmte die Zwischenablage trotzdem).
      const expectedIds = [...new Set(expectedCategories.map(cat => ROTATION_MAP.get(cat)).filter(Boolean))]; // Jet hat keine Checkbox und wird hier ausgefiltert
    
      const selectedIds = Array.from(document.querySelectorAll('.catCheckbox:checked'))
        .map(cb => cb.id)
        .filter(id => id !== "catGR");
    
      expectedIds.sort();
      selectedIds.sort();
    
      const hasJet = expectedCategories.includes("Jet");
      // Bei Jet-Slots weichen expectedIds/selectedIds (nur 2 echte Checkboxen) von selectedOrder (3 inkl. Jet) ab -
      // deshalb zusaetzlich pruefen, ob "Jet" schon korrekt in selectedOrder an seiner Position steht.
      const jetAlreadyApplied = hasJet && selectedOrder.length === expectedCategories.length &&
        expectedCategories.every((cat, i) => (cat === "Jet" ? selectedOrder[i] === "Jet" : true));
    
      if (!arraysEqual(expectedIds, selectedIds) || (hasJet && !jetAlreadyApplied) || triggeredByClick) {
        for (let cb of document.querySelectorAll('.catCheckbox')) {
          if (cb.id !== 'catGR') {
            cb.checked = false;
            cb.disabled = false;
          }
        }
    
        grandraceCategories = [];
        const newSelectedOrder = [];
    
        // Reihenfolge der Rotation 1:1 uebernehmen, inkl. "Jet" an seiner tatsaechlichen Position
        expectedCategories.forEach((cat) => {
          if (cat === "Jet") {
            newSelectedOrder.push("Jet"); // kein Checkbox-Pendant - nur virtueller Slot
            return;
          }
          const catBoxId = ROTATION_MAP.get(cat);
          const catCheckBox = document.getElementById(catBoxId);
          if (catCheckBox) {
            catCheckBox.checked = true;
            if (!newSelectedOrder.includes(catCheckBox.value)) newSelectedOrder.push(catCheckBox.value);
            grandraceCategories.push(catCheckBox);
          }
        });
    
        selectedOrder = newSelectedOrder;
        updateCheckboxBadges();
    
        // Alle 3 Slots sind durch Grandrace belegt (auch bei Jet) → restliche Checkboxen sperren, wie bei manueller 3er-Auswahl
        const grid = document.querySelector('.category-grid');
        if (grid) grid.classList.add('limit-reached');
        document.querySelectorAll('.catCheckbox:not(:checked)').forEach(cb => {
          if (cb.id !== 'catGR') cb.disabled = true;
        });
    
        updateSlotBoxes();
    
        const title = document.getElementById('yourPickTitle');
        if (selectedOrder.length > 0) {
          title.classList.remove('standby');
          title.classList.add('active');
        }
    
        updateResetButtonState();
        updateGoButtonState();
    
        const currentEventName = entry[0];
        const currentCategories = entry[1].replace(/>/g, "→");
        const modifierSuffix = entry[2] ? ` ⚠️ ${entry[2]} ⚠️` : "";
        const jetSuffix = hasJet ? ` 🛩️ ${t("grandrace_jet_hint")}` : "";
        showToast(`${t(triggeredByClick ? "rotation_applied_manual" : "rotation_applied_auto")}: ${currentEventName} | ${currentCategories}${modifierSuffix}${jetSuffix}`, "#39ff14", 10000);
      }
    }

    // Mini-Helfer außerhalb der Funktion:
    function arraysEqual(a, b) {
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
            if (a[i] !== b[i]) return false;
        }
        return true;
    }

    function handleCategoryClick(checkbox) {
      const value = checkbox.value;
    
      // Auswahl verwalten
      if (checkbox.checked) {
        if (!selectedOrder.includes(value)) {
          selectedOrder.push(value);
        }
      } else {
        selectedOrder = selectedOrder.filter(v => v !== value);
      }
    
      updateCheckboxBadges();
    
      // HOVER-Handling je nach Anzahl aktivierter Kategorien (ohne Grandrace)
      const checkedBoxes = Array.from(document.querySelectorAll('.catCheckbox:checked'))
                                .filter(cb => cb.id !== 'catGR');
      const grid = document.querySelector('.category-grid');
    
      if (checkedBoxes.length >= 3) {
        grid.classList.add('limit-reached');
        document.querySelectorAll('.catCheckbox:not(:checked)').forEach(cb => {
          if (cb.id !== 'catGR') cb.disabled = true; // ⛔ Grandrace bleibt aktivierbar
        });
      } else {
        grid.classList.remove('limit-reached');
        document.querySelectorAll('.catCheckbox').forEach(cb => {
          if (cb.id !== 'catGR') cb.disabled = false;
        });
      }
    
      // Slotboxen sofort anzeigen
      updateSlotBoxes();
    
      // Your Pick Titel aktivieren/deaktivieren
      const title = document.getElementById('yourPickTitle');
      if (selectedOrder.length > 0) {
        title.classList.remove('standby');
        title.classList.add('active');
      } else {
        title.classList.remove('active');
        title.classList.add('standby');
      }
    
      updateResetButtonState();
      updateGoButtonState();
    }
    
    function updateCheckboxBadges() {
      const allCheckboxes = document.querySelectorAll('.catCheckbox');
      allCheckboxes.forEach(cb => {
        const label = document.querySelector(`label[for="${cb.id}"]`);
        if (!label) return;
    
        let badge = label.querySelector('.order-badge');
        const index = selectedOrder.indexOf(cb.value);
    
        if (index !== -1) {
          if (!badge) {
            badge = document.createElement("span");
            badge.className = "order-badge";
            label.appendChild(badge);  // ✅ jetzt INS Label!
          }
          badge.innerText = (index + 1).toString();
        } else if (badge) {
          badge.remove();
        }
      });

    function updateSlotBoxes() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
    
      const title = document.getElementById('yourPickTitle');
      title.classList.remove('active', 'standby');
      title.classList.add(selectedOrder.length === 0 ? 'standby' : 'active');
    
      const categoriesToRender = [...selectedOrder.slice(0, 3)];
        if (categoriesToRender.length === 1) {
          categoriesToRender.push(categoriesToRender[0], categoriesToRender[0]); // 🧠 Dupliziere Kategorie 2x -> Slot 2 & 3
        } else if (categoriesToRender.length === 2) {
          categoriesToRender.push(categoriesToRender[0]); // 🧠 Dupliziere erste Kategorie als dritte
        } else {
          while (categoriesToRender.length < 3) {
            categoriesToRender.push("");
          }
        }
    
      categoriesToRender.forEach((cat, index) => {
        const isStandby = cat === "";
    
        // Farbklasse bestimmen
        let colorClass = '';
        if (!isStandby) {
          colorClass =
            ['Street Tier 1', 'Street Tier 2', 'Hypercar', 'Drift'].includes(cat) ? 'slot-yellow' :
            ['Racing', 'AGP'].includes(cat) ? 'slot-blue' :
            ['Rally', 'Rally Raid', 'Motocross'].includes(cat) ? 'slot-orange' :
            ['Monster Truck', 'Jet'].includes(cat) ? 'slot-magenta' :
            '';
        }
    
        const slot = document.createElement('div');
        slot.classList.add('slot-box');
        if (isStandby) {
          slot.classList.add('empty', 'slot-standby');
        } else {
          slot.classList.add(colorClass);
        }
    
        slot.innerHTML = `
          <div class="slot-badge">${index + 1}</div>
          <div class="slot-category">${isStandby ? "" : cat}</div>
          <div class="slot-name"><span class="question-mark">?</span></div>

        resultsDiv.appendChild(slot);

    // ============================================================
    // Twitch-Chat-Bot-Integration
    // ------------------------------------------------------------
    // Postet (und optional pinnt) das Ziehungsergebnis automatisch in den
    // Twitch-Chat eines konfigurierten Kanals, ueber einen gemeinsam
    // genutzten Cloudflare-Worker-Bot (kein eigener Twitch-Login noetig -
    // der Bot muss nur einmalig per "/mod <botname>" im eigenen Kanal als
    // Moderator gesetzt werden). Details: twitch-bot/README.md im Repo.
    // ============================================================

    // Fest hinterlegte Worker-URL des vom Betreiber gehosteten Bots (siehe
    // twitch-bot/README.md). Keine Eingabemoeglichkeit mehr im Frontend -
    // ein selbst gehosteter Worker erfordert eine eigene Kopie dieser Datei.
    const DEFAULT_TWITCH_WORKER_URL = "https://zendomizer-twitch-bot.shogun160.workers.dev";

    function loadTwitchSettings() {
      const token = localStorage.getItem("zendomizerTwitchToken") || "";
      const tokenInput = document.getElementById("twitchToken");
      if (tokenInput) tokenInput.value = token;
    }

    function saveTwitchSettings() {
      const token = (document.getElementById("twitchToken")?.value || "").trim();
      persist("zendomizerTwitchToken", token);

      const statusEl = document.getElementById("twitchStatusMsg");
      if (statusEl) {
        statusEl.textContent = "";
        statusEl.classList.remove("error");
      }
    }

    function toggleTwitchSettingsPanel() {
      const panel = document.getElementById("twitchSettingsPanel");
      if (!panel) return;
      panel.style.display = panel.style.display === "none" ? "flex" : "none";
    }

    // "Kanal verbinden" hat zwei Aufgaben, je nachdem ob schon ein Token
    // eingetragen ist:
    //   - Kein Token: Fehlermeldung ("bitte Token eintragen") UND den
    //     Twitch-Login des Workers in einem neuen Tab oeffnen, damit der
    //     Streamer sich dort einen Token holen und danach hier eintragen
    //     kann.
    //   - Token vorhanden: die feste Bestaetigungsnachricht senden (postet
    //     "ZENdomizer connected. Let's race." in den Chat) - das ersetzt
    //     den frueheren separaten "Testnachricht senden"-Knopf.
    function openTwitchConnect() {
      saveTwitchSettings();
      const token = localStorage.getItem("zendomizerTwitchToken") || "";
      const statusEl = document.getElementById("twitchStatusMsg");

      if (!token) {
        if (statusEl) {
          statusEl.textContent = t("twitch_token_missing");
          statusEl.classList.add("error");
        }
        window.open(DEFAULT_TWITCH_WORKER_URL.replace(/\/+$/, "") + "/auth/start", "_blank", "noopener");
        return;
      }

      sendTwitchAnnouncement(null, { type: "connected" });
    }

    // Strukturierte Ziehungsdaten fuer den Worker. Die Chat-Zeile baut der
    // Worker daraus selbst - so kann ueber diese Schnittstelle kein Freitext
    // in den Chat gelangen.
    function buildTwitchDraw(selection) {
      if (!selection || selection.length === 0) return [];
      return selection
        .filter(v => v && v.category)
        .map(v => ({ category: v.category, brand: v.brand, model: v.model, year: v.year }));
    }

    // Uebersetzt den Modifikator der laufenden Rotation in den Schluessel, den der
    // Worker kennt. Uebertragen wird NUR dieser Schluessel - Text und Icon setzt der
    // Worker selbst zusammen (MODIFIERS in twitch-bot/src/draw.js), damit ueber die
    // Twitch-Schnittstelle kein Freitext laeuft. Neue Modifikatoren gehoeren in beide
    // Listen; tests/twitch-modifier.test.mjs prueft, dass sie zueinander passen.
    const TWITCH_MODIFIER_KEYS = {
      "No Collision": "no_collision",
      "Special Selection": "special_selection",
      "Pro Racing": "pro_racing",
      "Air Only": "air_only",
      "Special Weather": "special_weather",
    };

    function currentTwitchModifier() {
      // Nur bei aktiver Grandrace-Auswahl: hat jemand die Kategorien von Hand
      // gewaehlt, gehoert der Modifikator der laufenden Rotation nicht zu dieser
      // Ziehung und wuerde im Chat in die Irre fuehren.
      const grandraceCheckbox = document.getElementById('catGR');
      if (!grandraceCheckbox || !grandraceCheckbox.checked) return null;

      const entry = ROTATION[getCurrentEventIndex()];
      return TWITCH_MODIFIER_KEYS[entry && entry[2]] || null;
    }

    // `options.type === "connected"` fordert beim Worker die feste
    // Bestaetigungsnachricht an (siehe worker.js, buildConnectedMessage() in
    // src/draw.js) - der Text selbst wird NICHT mitgeschickt, nur die
    // Anforderung. `draw` wird in diesem Fall ignoriert. Eine Testnachricht
    // wird außerdem nie angepinnt, auch wenn Ziehungsergebnisse immer
    // angepinnt werden - ein 20-minuetig angepinnter Test waere im Chat nur
    // stoerend.
    //
    // "Aktiv" ist Twitch-Posten jetzt allein dadurch, dass ein Token
    // hinterlegt ist - kein separater "enabled"-Schalter mehr. Fehlt der
    // Token, wird hier bewusst still abgebrochen (kein Fehlertext): das ist
    // der Normalfall fuer alle, die Twitch gar nicht eingerichtet haben und
    // wird nach jeder Ziehung automatisch aufgerufen (siehe handleGo()).
    // Der explizite "Kanal verbinden"-Knopf (openTwitchConnect()) deckt den
    // Fall "Token fehlt" mit einer eigenen, sichtbaren Fehlermeldung ab.
    async function sendTwitchAnnouncement(draw, options = {}) {
      const type = options.type || null;
      const isConnectedCheck = type === "connected";

      const token = (localStorage.getItem("zendomizerTwitchToken") || "").trim();
      if (!token) return;

      const pin = !isConnectedCheck;

      const statusEl = document.getElementById("twitchStatusMsg");

      if (!isConnectedCheck && (!draw || draw.length === 0)) return;

      const body = isConnectedCheck ? { token, type, pin } : { token, draw, pin };
      if (!isConnectedCheck) {
        const modifier = currentTwitchModifier();
        if (modifier) body.modifier = modifier;
      }

      try {
        const res = await fetch(DEFAULT_TWITCH_WORKER_URL.replace(/\/+$/, "") + "/announce", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));

        if (res.status === 401) {
          throw new Error(t("twitch_channel_not_connected"));
        }
        if (!res.ok || !data.success) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        if (statusEl) {
          statusEl.textContent = data.pinned
            ? t("twitch_sent_and_pinned")
            : t("twitch_sent");
          statusEl.classList.remove("error");
        }
      } catch (err) {
        console.warn("⚠️ Twitch-Ankündigung fehlgeschlagen:", err);
        if (statusEl) {
          statusEl.textContent = `${t("twitch_send_error")}: ${err.message || err}`;
          statusEl.classList.add("error");
        }
        // Bewusst kein showToast() hier - ein fehlgeschlagener Twitch-Post
        // soll die normale Ziehung nicht stoeren oder unnoetig auffallen.
      }
    }

      switch (bikeFilterMode) {

    function copyToClipboard(silent = false) {
      if (!lastSelection || lastSelection.length === 0) {
        if (!silent) showToast(t("no_selection_to_copy"));
        return;
      }

      let result = t("clipboard_heading");
    
      lastSelection.forEach(vehicle => {
        result += `|| ${vehicle.category}:\n  ${formatVehicleName(vehicle)}\n\n`;
      });
    
      navigator.clipboard.writeText(result.trim()).then(() => {
        if (!silent) {
          showToast(t("copied"));
        }
      });
    }

    
    function handleGo() {
      if (selectedOrder.length < 1) return;
      if (isDrawing) return; // Ziehung laeuft bereits - Doppelklick/Re-Entry ignorieren
      isDrawing = true;
    
      const SPIN_DURATION = 1800;
      drawExecuted = true;
      lastSelection = []; // ← reset vor neuer Ziehung
    
      // ✅ Durchgang hochzählen
      window.drawRound++;
      persist("zendomizerDrawRound", window.drawRound);
    
      updateSlotBoxes(); // 🟢 Slotboxen mit Fragezeichen vorbereiten
    
      const effectiveOrder = [...selectedOrder];
      if (effectiveOrder.length === 1) {
        effectiveOrder.push(effectiveOrder[0], effectiveOrder[0]); // Kategorie 2x duplizieren -> 3x dieselbe Kat
      } else if (effectiveOrder.length === 2) {
        effectiveOrder.push(effectiveOrder[0]); // Kategorie duplizieren
      }
    
      const wheel = document.getElementById("wheelOverlay");
      if (wheel) {
        document.documentElement.style.setProperty('--spin-duration', `${SPIN_DURATION}ms`);
        wheel.classList.add("spin");
    
        effectiveOrder.forEach((category, index) => {
          setTimeout(() => {
            fillSlotBox(index, category, true); // Jeder Slot einzeln, mit Flash
          }, 600 * (index + 1));
        });
    
        setTimeout(() => {
          wheel.classList.remove("spin");
        }, SPIN_DURATION);
      }
    
      // 🔓 Sperre wieder aufheben, sobald alle Slots gefuellt sind (unabhaengig vom wheel-Element)
      setTimeout(() => {
        isDrawing = false;
      }, SPIN_DURATION);
    
      updateResetButtonState();
    
      const btn = document.getElementById("goBtn");
      btn.classList.add("active", "clicked");
      setTimeout(() => btn.classList.remove("active", "clicked"), 750);
    
      if (selectedOrder.length === 2) {
        showToast(t("category_repeated", { category: effectiveOrder[2] }), "#ffa500", 6000);
      } else if (selectedOrder.length === 1) {
        showToast(t("category_repeated_all", { category: effectiveOrder[0] }), "#ffa500", 6000);
      }
    
      setTimeout(() => {
        copyToClipboard();
        sendTwitchAnnouncement(buildTwitchDraw(lastSelection));
      }, SPIN_DURATION + 100); // Sicherheitspuffer
    }

    document.addEventListener('keydown', (e) => {
      if (isTypingTarget(e.target)) return;
      // 🛠️ Bugfix: hier stand drawRandomVehicles(). Diese Altlast leerte #results per
      // innerHTML und baute die Slot-Boxen nie wieder auf - Enter loeschte also die Anzeige,
      // verbrauchte dabei drei Ziehungen aus der Blacklist und kopierte in die Zwischenablage.
      // handleGo() ist derselbe Weg wie der GO-Knopf.
      if (e.key === 'Enter') handleGo();
      if (e.key.toLowerCase() === 'c') copyToClipboard();
    });

      bikeFilterMode = "no_bike";

      const bfb = document.getElementById("bikeFilterBtn");
      if (bfb) {
        bfb.innerText = t("bike_no");

          }
          console.log("🧾 drawlog loaded from localStorage .");
        } catch (e) {

      }

    };
    document.addEventListener('click', function(e) {
      const box = e.target.closest('.slot-box');
      if (!box || !drawExecuted) return;
    
      const category = box.querySelector('.slot-category')?.textContent;
      if (!category) return;
      // Slot-Index aus dem DOM statt aus selectedOrder - siehe rerollSingleSlot()
      const slotIndex = Array.from(document.querySelectorAll('.slot-box')).indexOf(box);
      rerollSingleSlot(category, slotIndex);
    });

    
    function fillSlotBox(index, category, flash = true) {
      const boxes = document.querySelectorAll(".slot-box");
      if (!boxes[index]) return;
    
      const box = boxes[index];
      const filters = getCurrentFilters();
      const result = drawVehicleForCategory(category, filters, bikeFilterMode);
    
      if (!result) {
        box.querySelector(".slot-category").textContent = category;
        box.querySelector(".slot-name").textContent = "⚠️ kein Fahrzeug";
        box.querySelector(".slot-warning").textContent = t("not_enough_cars");
        box.classList.add("drawn");
        return;
      }
    
      const { vehicle, ignoredFilters } = result;

      lastSelection[index] = {
          brand: vehicle.brand,
          model: vehicle.model,
          year: vehicle.year,
          category: category,
          ignoredFilters: ignoredFilters
      };
    
      // Slot zurücksetzen
      box.classList.remove("empty", "slot-yellow", "slot-blue", "slot-orange", "slot-magenta");
    
      // Farbe bestimmen
      const colorClass =
        ['Street Tier 1', 'Street Tier 2', 'Hypercar', 'Drift'].includes(category) ? 'slot-yellow' :
        ['Racing', 'AGP'].includes(category) ? 'slot-blue' :
        ['Rally', 'Rally Raid', 'Motocross'].includes(category) ? 'slot-orange' :
        ['Monster Truck', 'Jet'].includes(category) ? 'slot-magenta' : '';
      if (colorClass) box.classList.add(colorClass);
    
      // Inhalt setzen
      box.querySelector(".slot-category").textContent = category;
      box.querySelector(".slot-name").textContent = formatVehicleName(vehicle);
      box.querySelector(".slot-warning").textContent =
        ignoredFilters.length ? `${t("ignored_filters")} ${ignoredFilters.join(", ")}` : "";
    
      box.classList.add("drawn");
    
      if (flash) {
        box.classList.add("flash");
        setTimeout(() => box.classList.remove("flash"), 800);
      }
    }

    
    function updateGoButtonState() {
      const btn = document.getElementById("goBtn");
      btn.classList.remove("inactive", "pulsing"); // 🔁 wichtig: beides entfernen
    
      if (selectedOrder.length < 1) {
        btn.classList.add("inactive");
      } else {
        btn.classList.add("pulsing"); // 🟢 aktiv, wenn mind. 1 Kategorie gewählt (Rest wird ggf. dupliziert)
      }
    }
    
    // 🛠️ Bugfix: der Slot-Index kam frueher aus selectedOrder.indexOf(category). selectedOrder ist
    // aber dedupliziert - bei Rotationen mit mehrfach belegter Kategorie ("Hyper > Hyper > Hyper",
    // "Racing > ST2 > Racing") und bei 1-2 manuell gewaehlten Kategorien zeigte er immer auf Slot 1,
    // ein Klick auf Slot 2 oder 3 rollte also sichtbar den falschen Slot. Der Aufrufer kennt den
    // echten Index und reicht ihn durch; der Default deckt Aufrufe ohne DOM-Bezug ab.
    function rerollSingleSlot(category, slotIndex = selectedOrder.indexOf(category)) {
      const index = slotIndex;
      if (index < 0 || index > 2) return; // vor der Ziehung pruefen, sonst verbraucht der Klick eine Ziehung

      const filters = getCurrentFilters();
      const result = drawVehicleForCategory(category, filters, bikeFilterMode);
      if (!result) {
        showToast(`${t("no_vehicle_found")}: ${category}`, "#f33");
        return;
      }
    
      const { vehicle, ignoredFilters } = result;
    
      // Manuell zur Blacklist hinzufügen, wenn noch nicht enthalten
      if (!recentDraws[category]) {
        recentDraws[category] = [];
      }
      if (!recentDraws[category].some(r => isSameVehicle(r, vehicle))) {
        recentDraws[category].push(vehicle);
        persist("zendomizerRecentDraws", JSON.stringify(recentDraws));
      }

      while (lastSelection.length < 3) {
        lastSelection.push(null);
      }
    
      const oldVehicle = lastSelection[index];
      lastSelection[index] = { ...vehicle, ignoredFilters };
    
      // ✅ Log-Eintrag ohne drawRound++ → stattdessen mit "(manual)"
      const manualLabel = `${window.drawRound} (manual)`;
      appendDrawLog({
        durchgang: manualLabel,
        category: category,
        selected: formatVehicleName(vehicle),
        appliedFilters: "-", // Optional: echte Filter auslesen
        ignoredFilters: ignoredFilters.length
          ? "❗ " + ignoredFilters.join(', ')
          : "✅ none",
        blockedCount: recentDraws[category]?.length || 0,
        availableCount: vehicles.filter(v => v.category === category).length,
        timestamp: new Date().toLocaleString("de-DE")
      });
    
      const slot = document.querySelectorAll('.slot-box')[index];
      if (!slot) return;
    
      const nameDiv = slot.querySelector('.slot-name');
      const warnDiv = slot.querySelector('.slot-warning');
    
      nameDiv.textContent = formatVehicleName(vehicle);
      warnDiv.innerHTML = ignoredFilters.length
        ? `${t("ignored_filters")} ${ignoredFilters.join(', ')}`
        : '';
    
      // ❗ Farbanpassung
      slot.classList.remove('empty', 'slot-yellow', 'slot-blue', 'slot-orange', 'slot-magenta');
      const colorClass =
        ['Street Tier 1', 'Street Tier 2', 'Hypercar', 'Drift'].includes(category) ? 'slot-yellow' :
        ['Racing', 'AGP'].includes(category) ? 'slot-blue' :
        ['Rally', 'Rally Raid', 'Motocross'].includes(category) ? 'slot-orange' :
        ['Monster Truck', 'Jet'].includes(category) ? 'slot-magenta' :
        '';
      if (colorClass) {
        slot.classList.add(colorClass);
      }
    
      // Flash-Effekt
      slot.classList.add("flash");
      setTimeout(() => slot.classList.remove("flash"), 800);
    
      const isSame = isSameVehicle(oldVehicle, vehicle);
    
      if (isSame) {
        showToast(t("no_alternative_available"), "#999");
        copyToClipboard(true);
      } else {
        copyToClipboard();
      }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function drawVehicleForCategory(category, filters, bikeFilterMode) {
      // 🛩️ Jet ist ein festes Bonusfahrzeug (Grandrace) ohne Eintrag in vehicles.json und ohne Filter-Checkbox
      if (category === "Jet") {
        return { vehicle: { ...JET_VEHICLE }, ignoredFilters: [] };
      }
    
      let ignored = [];
    
      // 🔎 1. Grundfilter
      let finalList = vehicles.filter(v =>
        v.category === category &&
        (
          (bikeFilterMode === 'all') ||
          (bikeFilterMode === 'no_bike' && !v.bike) ||
          (bikeFilterMode === 'bike' && v.bike) ||
          (bikeFilterMode === 'top_tier' && v.top_tier === true) ||
          (bikeFilterMode === 'rc_cars' && v.brand === 'PHAZR RC')
        ) &&
        (!filters.country || v.country === filters.country) &&
        (!filters.era || v.era === filters.era) &&
        (!filters.brand || v.brand === filters.brand)
      );
    
      // 🔁 2. Fallbacks – nacheinander Filter lockern
      if (finalList.length === 0 && bikeFilterMode !== 'all') {
        finalList = vehicles.filter(v =>
          v.category === category &&
          (bikeFilterMode !== 'top_tier' || v.top_tier === true) && // ⬅️ wichtig!
          (bikeFilterMode !== 'rc_cars' || v.brand === 'PHAZR RC') && // ⬅️ wichtig!
          (!filters.country || v.country === filters.country) &&
          (!filters.era || v.era === filters.era) &&
          (!filters.brand || v.brand === filters.brand)
        );
        if (finalList.length > 0) ignored.push("Bike-Filter");
      }
    
      if (finalList.length === 0 && filters.era) {
        finalList = vehicles.filter(v =>
          v.category === category &&
          (bikeFilterMode === 'all' || (bikeFilterMode === 'no_bike' && !v.bike) || (bikeFilterMode === 'bike' && v.bike)) &&
          (!filters.country || v.country === filters.country) &&
          (!filters.brand || v.brand === filters.brand)
        );
        if (finalList.length > 0) ignored.push(`${t("label_era")} (${translateEra(filters.era)})`);
      }
    
      if (finalList.length === 0 && filters.brand) {
        finalList = vehicles.filter(v =>
          v.category === category &&
          (bikeFilterMode === 'all' || (bikeFilterMode === 'no_bike' && !v.bike) || (bikeFilterMode === 'bike' && v.bike)) &&
          (!filters.country || v.country === filters.country) &&
          (!filters.era || v.era === filters.era)
        );
        if (finalList.length > 0) ignored.push(`${t("label_brand")} (${filters.brand})`);
      }
    
      if (finalList.length === 0 && filters.country) {
        finalList = vehicles.filter(v =>
          v.category === category &&
          (bikeFilterMode === 'all' || (bikeFilterMode === 'no_bike' && !v.bike) || (bikeFilterMode === 'bike' && v.bike)) &&
          (!filters.era || v.era === filters.era) &&
          (!filters.brand || v.brand === filters.brand)
        );
        if (finalList.length > 0) ignored.push(`${t("label_country")} (${translateCountry(filters.country)})`);
      }
    
      if (finalList.length === 0) {
        finalList = vehicles.filter(v =>
          v.category === category &&
          (bikeFilterMode === 'all' || (bikeFilterMode === 'no_bike' && !v.bike) || (bikeFilterMode === 'bike' && v.bike))
        );
        if (finalList.length > 0) {
          if (filters.era) ignored.push(`${t("label_era")} (${translateEra(filters.era)})`);
          if (filters.brand) ignored.push(`${t("label_brand")} (${filters.brand})`);
          if (filters.country) ignored.push(`${t("label_country")} (${translateCountry(filters.country)})`);
        }
      }
    
      if (finalList.length === 0) {
        finalList = vehicles.filter(v => v.category === category);
        if (finalList.length > 0) ignored.push(t("all_filters"));
      }
    
      if (finalList.length === 0) return null; // ❌ gar kein Fahrzeug gefunden
    
      // 📦 Soft-Sperre aktivieren
      if (!recentDraws[category]) {
        recentDraws[category] = [];
      }
      const recent = recentDraws[category];
    
      const availableVehicles = finalList.filter(v => !recent.some(r => isSameVehicle(r, v)));

      const blockedCount = finalList.length - availableVehicles.length;
      const allBlocked = availableVehicles.length === 0;

      // 🧹 Wenn alle Fahrzeuge des aktuellen Pools gezogen wurden → Blacklist zurücksetzen
      // 🛠️ Bugfix: hier stand zusaetzlich "&& recent.length === finalList.length". Die Blacklist
      // sammelt aber ueber ALLE Filterzustaende hinweg, waehrend finalList gefiltert ist - nach der
      // ersten Ziehung mit abweichendem Filter war diese Gleichheit unerreichbar. Der Reset griff
      // dann nie mehr, und der Fallback "pool = finalList" zog dauerhaft mit Wiederholungen.
      let carryOver = null;
      if (allBlocked) {
        // 🛠️ Bugfix: vorher "recentDraws[category] = []" - danach zeigte die weiter unten benutzte
        // Konstante "recent" auf das weggeworfene Array, der push() landete im Nirwana und das
        // erste Fahrzeug der neuen Runde blieb ungesperrt. In-place leeren behaelt die Referenz.
        carryOver = recent[recent.length - 1] || null; // zuletzt gezogen - eroeffnet die neue Runde nicht
        recent.length = 0;
        persist("zendomizerRecentDraws", JSON.stringify(recentDraws));
      
        // 👉 2) Toast anzeigen
        //showToast(`🧹 Kategorie <b>${category}</b>: Alle Fahrzeuge wurden gezogen – Blacklist wurde zurückgesetzt.`, "#ffa500", 7000);
        showToast(t("blacklist_reset_notice", { category }), "#ffa500", 7000);
    
        // 👉 3) Vermerk im Ziehlog
        appendDrawLog({
          durchgang: "-",
          category: category,
          selected: "Blacklist zurückgesetzt (Rotation vollständig)",
          appliedFilters: "-",
          ignoredFilters: "-",
          blockedCount: finalList.length,
          availableCount: finalList.length,
          timestamp: new Date().toLocaleString("de-DE")
        });
      }
    
      // Nach einem Reset steht wieder der volle Pool bereit - nur das zuletzt gezogene Fahrzeug
      // bleibt aussen vor, damit es nicht ueber den Rundenwechsel hinweg direkt doppelt kommt.
      let pool = allBlocked ? finalList : availableVehicles;
      if (carryOver && pool.length > 1) {
        pool = pool.filter(v => !isSameVehicle(v, carryOver));
      }
      shuffle(pool);
    
      const vehicle = pool[0];
    
      // 🔒 In Blacklist eintragen (nur wenn noch nicht drin)
      if (!recent.some(r => isSameVehicle(r, vehicle))) {
        recent.push(vehicle);
        persist("zendomizerRecentDraws", JSON.stringify(recentDraws));
      }
    
      // 📢 Konsoleninfo (nur wenn Dev-Logging aktiv)
      if (window.devLoggingEnabled && finalList.length > 0) {
        if (availableVehicles.length > 0) {
          const effectiveChance = (1 / availableVehicles.length * 100).toFixed(2);
          console.log(`📦 Category: ${category} | 🚗 available: ${availableVehicles.length} | 🚫 blocked: ${blockedCount} | 🎯 propability: ${effectiveChance}%`);
        } else {
          console.log(`⚠️ Category: ${category} | 🔁 automatic blacklist reset - all cars drawn`);
        }
      }
        
      // Aktive Filter erfassen
      const applied = [];
      if (filters.brand) applied.push(`Marke (${filters.brand})`);
      if (filters.country) applied.push(`Land (${filters.country})`);
      if (filters.era) applied.push(`Zeitraum (${filters.era})`);
      if (bikeFilterMode === "no_bike") applied.push("Cars only");
      else if (bikeFilterMode === "top_tier") applied.push("Top Tier only");
      else if (bikeFilterMode === "rc_cars") applied.push("RC Cars only");
      else if (bikeFilterMode === "bike") applied.push("Bikes only");
      else applied.push("All Vehicles");
    
      // 🧾 Ziehung loggen
     appendDrawLog({
      durchgang: window.drawRound,
      category: category,
      selected: formatVehicleName(vehicle),
      appliedFilters: applied.length ? applied.join(", ") : "-",
      ignoredFilters: ignored.length ? "❗ " + ignored.join(" | ") : "✅ none",
      blockedCount: blockedCount,
      availableCount: finalList.length,
      timestamp: new Date().toLocaleString("de-DE")
    });
    return { vehicle, ignoredFilters: ignored };
}

    function updateGrandraceTicker() {
      const tickerContent = document.getElementById('grandraceContent');
      if (!tickerContent) return;
      
      const entry = ROTATION[getCurrentEventIndex()];
      const currentEvent = entry[0];
      const currentModifier = entry[2] || null;
      
      const spacer = '&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;';

      // Route und Modifier als getrennte Segmente, ueber denselben spacer verbunden
      // -> gleichmaessiger Abstand Route<->Modifier<->Route (vorher: kleiner " &nbsp;"
      // Abstand vor dem Modifier, aber grosser spacer danach - ungleichmaessig)
      const routePart = `🏁 Ready for <strong class="pulse-glow">${currentEvent}</strong>? Let's race! 🏁`;
      const modifierPart = currentModifier ? `⚠️ <strong>${currentModifier}</strong> ⚠️` : "";
      const segments = modifierPart ? [routePart, modifierPart] : [routePart];
      const message = segments.join(spacer);
      
      // Mehrfach Wiederholen, damit der Lauftext lang genug wird
      tickerContent.innerHTML = (message + spacer).repeat(8);
    }
    
    // Direkt beim Laden ausführen
    window.addEventListener('load', updateGrandraceTicker);
    window.addEventListener('load', () => {
        const grandraceCheckbox = document.getElementById('catGR');
        if (grandraceCheckbox) {
            grandraceCheckbox.checked = true;
            setTimeout(() => {
              updateGrandraceState(true);
            }, 300); // ✨ 300ms Verzögerung NUR beim Laden
        }
    });

    
    // Optional: Alle 15 Sekunden neu prüfen
    setInterval(updateGrandraceTicker, 15000);
    
    function showToast(message = "✅ In Zwischenablage kopiert!", color = "#0af", duration = 3000) {
      const toast = document.getElementById("toast");
      if (!toast || !message || message.trim() === "") return; // Keine leeren Toasts
    
      toast.innerHTML = message;
    
      // Fixer schwarzer Hintergrund mit Transparenz
      toast.style.backgroundColor = "rgba(0, 0, 0, 0.75)";
      toast.style.color = color; // Farbiger Text
      toast.style.opacity = 1;
    
      if (window.toastTimer) clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.style.opacity = 0;
        window.toastTimer = null;
      }, duration);
    }
    
    setInterval(() => updateGrandraceState(false), 1000); // alle 1000ms prüfen
    
    const countrySelect = document.getElementById('countrySelect');
    
    countrySelect.addEventListener('change', () => {
      const selectedOption = countrySelect.options[countrySelect.selectedIndex];
    
      // Bei erneutem Öffnen Dropdown zurücksetzen
      countrySelect.addEventListener('mousedown', () => {
        Array.from(countrySelect.options).forEach(opt => {
          if (opt.getAttribute('data-original')) {
            opt.text = opt.getAttribute('data-original');
          }
        });
      }, { once: true });
    });
    document.addEventListener("keydown", function (e) {
      if (isTypingTarget(e.target)) return; // nicht waehrend des Tippens, siehe isTypingTarget()
      // SHIFT + ? → Hotkey-Legende anzeigen
      if (e.shiftKey && (e.key === '?' || e.key.toLowerCase() === 'h')) {
        showToast(t("hotkey_help"), "#0af", 30000);
      }
      // SHIFT + L → Ziehlog anzeigen
      if ((e.shiftKey) && e.key.toLowerCase() === 'l') {
        if (window.drawLog && window.drawLog.length) {
          console.table(window.drawLog);
          showToast("📋 log opened", "#0af");
        } else {
          console.log("ℹ️ log is empty.");
          showToast("ℹ️ log is empty", "#aaa");
        }
      }
      // SHIFT + L → Blacklist Löschen
      if ((e.shiftKey) && e.key.toLowerCase() === 'r') {
        recentDraws = {};
        localStorage.removeItem("zendomizerRecentDraws");
        // 🔄 Zähler zurücksetzen
        window.drawRound = 0;
        persist("zendomizerDrawRound", "0");
        showToast(t("blacklist_cleared"), "#f44336");
        console.log("🧹 reset recentDraws via hotkey.");
        appendDrawLog({
          durchgang: 'RESET',
          category: '-',
          selected: '-',
          appliedFilters: '-',
          ignoredFilters: '-',
          blockedCount: '-',
          availableCount: '-',
          timestamp: new Date().toLocaleString("de-DE")
        });
      }
      // SHIFT + X → Ziehlog zurücksetzen
      if (e.shiftKey && e.key.toLowerCase() === 'x') {
        window.drawRound = 0;
        window.drawLog = [];
        window.recentDraws = {};
    
        persist("zendomizerDrawRound", "0");
        localStorage.removeItem("zendomizerDrawLog");
        localStorage.removeItem("zendomizerRecentDraws");
    
        showToast(t("drawlog_cleared"), "#f44336");
        console.log("🗑️ drawLog cleared via hotkey");
      }
        
      // SHIFT + G → Logging aktivieren/deaktivieren
      if (e.shiftKey && e.key.toLowerCase() === 'g') {
        window.devLoggingEnabled = !window.devLoggingEnabled;
        const state = window.devLoggingEnabled ? "active" : "inactive";
        console.log(`🛠️ Dev-Logging ${state}`);
        showToast(`🛠️ Dev-Logging ${state}`, window.devLoggingEnabled ? "#0af" : "#aaa");
      }
    });
  </script>
<div id="toast" class="toast"></div>
